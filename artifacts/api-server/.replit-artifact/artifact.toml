kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "uv run --frozen --project artifacts/api-server uvicorn app.main:app --host 0.0.0.0 --port $PORT"

[services.production]

[services.production.build]
args = ["uv", "sync", "--frozen", "--project", "artifacts/api-server"]

[services.production.run]
args = ["sh", "-c", "uv run --frozen uvicorn app.main:app --host 0.0.0.0 --port $PORT"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
